services:
  db:
    restart: always
    image: postgres:18-alpine
    ports:
      - '5432:5432'
    networks:
      - db_net
    environment:
      POSTGRES_USER: pypi_scraper
      POSTGRES_PASSWORD: password
      POSTGRES_DB: defaultdb
    volumes:
      - db:/var/lib/postgresql
      - './sql:/docker-entrypoint-initdb.d/'

  broker:
    restart: always
    image: rabbitmq:4-management-alpine
    networks:
      - broker_net
    ports:
      - '8080:15672'
      - '5672:5672'
    environment:
      RABBITMQ_DEFAULT_USER: pypi_scraper
      RABBITMQ_DEFAULT_PASS: password
      RABBITMQ_DEFAULT_VHOST: pypi_scraper
    volumes:
      - broker:/var/lib/rabbitmq

  package_processor:
    restart: always
    build:
      context: .
      dockerfile: app.Dockerfile
      tags:
        - pypi_scraper/app
    deploy:
      replicas: 1
    command: ["python", "src/pipdepgraph/entrypoints/rmq_sub/package_processor.py"]
    networks:
      - db_net
      - broker_net
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: defaultdb
      POSTGRES_USER: pypi_scraper
      POSTGRES_PASSWORD: password

      RABBITMQ_HOST: broker
      RABBITMQ_VHOST: pypi_scraper
      RABBITMQ_USERNAME: pypi_scraper
      RABBITMQ_PASSWORD: password
    depends_on:
      - db
      - broker

  distribution_processor:
    restart: always
    deploy:
      replicas: 1
    build:
      context: .
      dockerfile: app.Dockerfile
      tags:
        - pypi_scraper/app
    command: ["python", "src/pipdepgraph/entrypoints/rmq_sub/distribution_processor.py"]
    networks:
      - db_net
      - broker_net
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: defaultdb
      POSTGRES_USER: pypi_scraper
      POSTGRES_PASSWORD: password

      RABBITMQ_HOST: broker
      RABBITMQ_VHOST: pypi_scraper
      RABBITMQ_USERNAME: pypi_scraper
      RABBITMQ_PASSWORD: password

      DIST_PROCESSOR_DISCOVER_PACKAGE_NAMES: "true"
    depends_on:
      - db
      - broker

  candidate_correlator_requirements:
    restart: always
    build:
      context: .
      dockerfile: app.Dockerfile
      tags:
        - pypi_scraper/app
    command: ["python", "src/pipdepgraph/entrypoints/rmq_sub/candidate_correlator_requirements.py"]
    networks:
      - db_net
      - broker_net
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: defaultdb
      POSTGRES_USER: pypi_scraper
      POSTGRES_PASSWORD: password
      RABBITMQ_HOST: broker
      RABBITMQ_VHOST: pypi_scraper
      RABBITMQ_USERNAME: pypi_scraper
      RABBITMQ_PASSWORD: password
    depends_on:
      - db
      - broker


  candidate_correlator_versions:
    restart: always
    build:
      context: .
      dockerfile: app.Dockerfile
      tags:
        - pypi_scraper/app
    command: ["python", "src/pipdepgraph/entrypoints/rmq_sub/candidate_correlator_versions.py"]
    networks:
      - db_net
      - broker_net
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: defaultdb
      POSTGRES_USER: pypi_scraper
      POSTGRES_PASSWORD: password
      RABBITMQ_HOST: broker
      RABBITMQ_VHOST: pypi_scraper
      RABBITMQ_USERNAME: pypi_scraper
      RABBITMQ_PASSWORD: password
    depends_on:
      - db
      - broker


  cdc:
    restart: on-failure
    build:
      context: .
      dockerfile: app.Dockerfile
      tags:
        - pypi_scraper/app
    command: ["python", "src/pipdepgraph/entrypoints/cdc/publisher.py"]
    networks:
      - db_net
      - broker_net
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: defaultdb
      POSTGRES_USER: cdc_user
      POSTGRES_PASSWORD: password
      RABBITMQ_HOST: broker
      RABBITMQ_VHOST: pypi_scraper
      RABBITMQ_USERNAME: pypi_scraper
      RABBITMQ_PASSWORD: password
    depends_on:
      - db
      - broker

  cdc_requirements:
    restart: on-failure
    build:
      context: .
      dockerfile: app.Dockerfile
      tags:
        - pypi_scraper/app
    command: ["python", "src/pipdepgraph/entrypoints/cdc/requirements_subscriber.py"]
    networks:
      - broker_net
    environment:
      RABBITMQ_HOST: broker
      RABBITMQ_VHOST: pypi_scraper
      RABBITMQ_USERNAME: pypi_scraper
      RABBITMQ_PASSWORD: password
    depends_on:
      - broker

  cdc_versions:
    restart: on-failure
    build:
      context: .
      dockerfile: app.Dockerfile
      tags:
        - pypi_scraper/app
    command: ["python", "src/pipdepgraph/entrypoints/cdc/versions_subscriber.py"]
    networks:
      - broker_net
    environment:
      RABBITMQ_HOST: broker
      RABBITMQ_VHOST: pypi_scraper
      RABBITMQ_USERNAME: pypi_scraper
      RABBITMQ_PASSWORD: password
    depends_on:
      - broker


volumes:
  db:
  broker:

networks:
  db_net:
  broker_net:
